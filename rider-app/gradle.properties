android.useAndroidX=true
android.enableJetifier=true

# Optimized for low-spec PCs (reduced from 2048m to 1024m)
org.gradle.jvmargs=-Xmx1024m -Xms512m --add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.util=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED
android.suppressUnsupportedCompileSdk=34

# Enable Gradle daemon for faster builds (reuses JVM between builds)
org.gradle.daemon=true

# Enable parallel build with limited workers for low-spec PCs
org.gradle.parallel=true
org.gradle.workers.max=2

# Enable build cache for faster incremental builds
org.gradle.caching=true
android.enableBuildCache=true

# Configure on-demand to only build necessary modules
org.gradle.configureondemand=true

# Enable file system watching for faster syncs (Gradle 7.0+)
org.gradle.vfs.watch=true

# Disable build features that slow down compilation
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=true
android.defaults.buildfeatures.shaders=false
