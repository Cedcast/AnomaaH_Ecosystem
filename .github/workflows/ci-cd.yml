name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Validate environment
        run: python3 scripts/validate_env.py || true

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('rider-app/**/*.gradle*', 'rider-app/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x rider-app/gradlew

      - name: Build debug APK
        working-directory: rider-app
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rider-app-debug
          path: rider-app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Decode keystore
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          RIDER_KEYSTORE_BASE64: ${{ secrets.RIDER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RIDER_KEYSTORE_BASE64" ]; then
            echo "$RIDER_KEYSTORE_BASE64" | base64 --decode > rider-app/rider-app.jks
          else
            echo "::error::RIDER_KEYSTORE_BASE64 secret is not configured. Please add it to the repository secrets."
            exit 1
          fi

      - name: Build release APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: rider-app
        env:
          RIDER_KEYSTORE_PATH: ./rider-app.jks
          RIDER_KEYSTORE_PASSWORD: ${{ secrets.RIDER_KEYSTORE_PASSWORD }}
          RIDER_KEY_ALIAS: ${{ secrets.RIDER_KEY_ALIAS }}
          RIDER_KEY_PASSWORD: ${{ secrets.RIDER_KEY_PASSWORD }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: rider-app-release
          path: rider-app/build/outputs/apk/release/*.apk
          retention-days: 30
